[package]
name = "dictionary-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bzip2 = "0.6.1"
clap = { version = "4.6.1", features = ["derive"] }
encoding_rs = "0.8.35"
flate2 = "1.1.9"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "gzip", "http2", "system-proxy"] }
spellbook = "0.4.2"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
